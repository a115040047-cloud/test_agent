<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity 破冰成功！</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e4efe9 100%);
      padding: 20px;
    }

    /* 粉彩漸層卡片 */
    .card {
      width: 100%;
      max-width: 440px;
      padding: 48px 36px;
      border-radius: 28px;
      background: linear-gradient(145deg, #ffdde1 0%, #ee9ca7 50%, #b5c6e0 100%);
      box-shadow: 0 20px 45px rgba(238, 156, 167, 0.25),
                  0 8px 18px rgba(0, 0, 0, 0.04);
      text-align: center;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(10px);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 25px 50px rgba(238, 156, 167, 0.32),
                  0 10px 22px rgba(0, 0, 0, 0.05);
    }

    .title {
      font-size: 1.85rem;
      font-weight: 700;
      color: #2d3748;
      letter-spacing: -0.5px;
      margin-bottom: 28px;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.6);
    }

    /* 精美發光按鈕 */
    .glow-btn {
      position: relative;
      outline: none;
      border: none;
      padding: 16px 40px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #ffffff;
      border-radius: 9999px;
      cursor: pointer;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      box-shadow: 0 0 25px rgba(102, 126, 234, 0.6),
                  0 4px 15px rgba(118, 75, 162, 0.4);
      transition: all 0.25s ease-in-out;
      user-select: none;
    }

    .glow-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 35px rgba(102, 126, 234, 0.85),
                  0 6px 20px rgba(118, 75, 162, 0.55);
    }

    .glow-btn:active {
      transform: scale(0.98);
      box-shadow: 0 0 18px rgba(102, 126, 234, 0.6);
    }

    /* 點擊結果與小語區域 */
    .result-container {
      margin-top: 32px;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .click-count {
      font-size: 0.95rem;
      font-weight: 600;
      color: #4a5568;
      background: rgba(255, 255, 255, 0.5);
      padding: 4px 14px;
      border-radius: 12px;
      display: inline-block;
    }

    .quote {
      font-size: 1.05rem;
      color: #2d3748;
      font-weight: 500;
      line-height: 1.5;
      animation: fadeIn 0.4s ease-in-out;
      padding: 0 10px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1 class="title">Antigravity 破冰成功！</h1>
    <button id="icebreakerBtn" class="glow-btn">點擊破冰</button>
    <div class="result-container">
      <div id="counter" class="click-count">點擊次數：0 次</div>
      <div id="quote" class="quote">點擊上方按鈕，接收今日好運與力量 ✨</div>
    </div>
  </div>

  <script>
    const quotes = [
      "每一次嘗試，都是邁向卓越的關鍵一步！",
      "程式碼如詩，未來的可能由你親手創造！",
      "保持好奇與熱忱，星辰大海正等待著你！",
      "相信過程，最棒的靈感正在悄悄綻放 ✨",
      "突破界限，你擁有的潛力遠超自己想像！",
      "今天的每一步前進，都在堆砌明天的奇蹟！",
      "心之所向，行之所至，無所畏懼！"
    ];

    let count = 0;
    let lastIndex = -1;
    const btn = document.getElementById('icebreakerBtn');
    const counterDisplay = document.getElementById('counter');
    const quoteDisplay = document.getElementById('quote');

    btn.addEventListener('click', () => {
      count++;
      counterDisplay.textContent = `點擊次數：${count} 次`;

      // 隨機選擇鼓勵小語（避免連續選到相同句子）
      let randomIndex;
      do {
        randomIndex = Math.floor(Math.random() * quotes.length);
      } while (quotes.length > 1 && randomIndex === lastIndex);
      lastIndex = randomIndex;

      // 觸發重新淡入動畫
      quoteDisplay.style.animation = 'none';
      void quoteDisplay.offsetWidth; // 強制重繪 (reflow)
      quoteDisplay.style.animation = 'fadeIn 0.4s ease-in-out';
      quoteDisplay.textContent = quotes[randomIndex];
    });
  </script>
</body>
</html>
